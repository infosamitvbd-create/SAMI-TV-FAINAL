[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Route SAMI TV live stream requests through the Netlify HTTPS reverse proxy function
[[redirects]]
  from = "/api/stream/*"
  to = "/.netlify/functions/stream"
  status = 200
  force = true

[[headers]]
  for = "/api/stream/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Single Page Application (SPA) catch-all rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
